[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "history-research-agent"
version = "0.1.0"
description = "Evidence-grounded local RAG for modern Chinese history research (1921-1978)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pymupdf>=1.25",
    "pypdf>=5.1",
    "typer>=0.15",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=3.3,<4",
    "paddlepaddle==3.2.0",
]
vector = [
    "qdrant-client[fastembed]>=1.14.2,<2",
]
app = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
history-agent = "history_agent.cli:app"

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
history_agent = ["py.typed", "web/static/*"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["history_agent"]
